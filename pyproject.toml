[project]
name = "chlorophyll-substituents-scan"
version = "0.2.0"
description = "Cone-scan analysis of chlorophyll substituents from CryoEM maps via ESP polar plots"
readme = "README.md"
authors = [
    { name = "Giovanni Consoli", email = "gconsoli@ic.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "gemmi>=0.7.5",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
]

[project.scripts]
chlorophyll-analyzer = "chlorophyll_substituents_scan:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
notebook = [
    "jupyterlab>=4.6.1",
    "matplotlib>=3.11.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
]
